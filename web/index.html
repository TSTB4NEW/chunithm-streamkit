<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="/manifest.json">
<title>CHUNITHM StreamKit Overlay</title>
<style>
  :root {
    /* 判定配色（游戏内）：JC 金 / J 橙 / ATTACK 绿 / MISS 灰 */
    --jc: #ffcf3a;
    --ju: #ff9a3a;
    --at: #4ade80;
    --mi: #9aa0b0;
    --fg: #eef2ff;
    --dim: #8a91a8;
    --bg: rgba(10, 12, 24, 0.96);
    --panel-w: 452px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: var(--fg);
    /* 等比例放大：452px 内部布局 → 570px 输出 */
    --ui-scale: 1.26106;
    width: var(--panel-w);
    zoom: var(--ui-scale);
  }

  /* OBS 源：不做缩放适配，按 1:1 像素渲染（避免整页 zoom 导致贴图发虚） */
  html.skin-game body { --panel-w: 570px; --ui-scale: 1; }
  /* 给骑在卡片边缘上的品牌留出溢出空间 */
  html.skin-game body { padding-top: 84px; }
  html.skin-game .jcell { width: 268px; height: 39px; background-size: 268px 39px; }
  html.skin-game .judges { gap: 4px 8px; }
  #stack {
    position: relative;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 24px rgba(0,0,0,.45);
    overflow: hidden;
  }

  /* 手机/窄屏：不再按 570px 缩放，直接铺满设备宽度 */
  @media (max-width: 520px) {
    body {
      --ui-scale: 1;
      width: 100%;
      max-width: 100%;
      margin: 0;
    }
    #stack { width: 100%; border-radius: 10px; }
    #panel { padding: 10px 12px 14px; }
    .title { font-size: 21px; }
    .artist { font-size: 13px; }
    .qminis { flex-basis: 46px; }
    .qmini { width: 46px; height: 44px; flex-basis: 44px; }
    .qslot.expanded .art { width: 84px; height: 84px; flex-basis: 84px; }
    .qslot.expanded .qt { font-size: 15px; }
    .qslot.expanded .qd { font-size: 12px; }
    .qslot.expanded .qexp .er { font-size: 9px; }
    #tip { max-width: 200px; }
  }

  /* JS 兜底：手机 UA/窄屏触摸设备 */
  html.mobile body {
    --ui-scale: 1;
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  html.mobile #stack { width: 100%; border-radius: 10px; }
  html.mobile #panel { padding: 10px 12px 14px; }
  html.mobile .title { font-size: 21px; }
  html.mobile .artist { font-size: 13px; }
  html.mobile .qminis { flex-basis: 46px; }
  html.mobile .qmini { width: 46px; height: 44px; flex-basis: 44px; }
  html.mobile .qslot.expanded .art { width: 84px; height: 84px; flex-basis: 84px; }
  html.mobile .qslot.expanded .qt { font-size: 15px; }
  html.mobile .qslot.expanded .qd { font-size: 12px; }
  html.mobile .qslot.expanded .qexp .er { font-size: 9px; }
  html.mobile #tip { max-width: 200px; }

  @media (orientation: landscape) and (max-height: 520px) {
    html.mobile #panel { padding: 6px 10px 8px; }
    html.mobile .song { margin-top: 6px; gap: 8px; }
    html.mobile .title { font-size: 18px; }
    html.mobile .mc-list { max-height: 96px; }
  }

  .mobileChat { display: none; }
  html.mobile .mobileChat {
    display: block;
    border-top: 1px solid rgba(255,255,255,.08);
    padding: 8px 12px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.02);
  }
  .mc-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 6px;
  }
  .mc-head span { font-size: 11px; font-weight: 700; color: #dfe6ff; }
  .mc-head em { font-style: normal; font-size: 8px; color: #7f88a3; }
  .mc-list { display: flex; flex-direction: column; gap: 5px; max-height: 160px; overflow-y: auto; }
  .mc-row { display: flex; gap: 7px; font-size: 12px; line-height: 1.4; min-width: 0; }
  .mc-row b { flex: 0 0 auto; max-width: 96px; color: #ffcf3a; font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc-row span { color: #d5daea; min-width: 0; font-size: 12px; word-break: break-word; }
  .mc-send { display: flex; gap: 6px; margin-top: 7px; }
  .mc-send input {
    flex: 1 1 auto; min-width: 0;
    height: 30px; padding: 0 9px;
    border: 1px solid rgba(255,255,255,.18); border-radius: 6px;
    background: rgba(0,0,0,.28); color: #eef2ff;
    font-size: 11px; font-family: inherit; outline: none;
  }
  .mc-send input:focus { border-color: rgba(255,207,58,.65); }
  .mc-send button {
    flex: 0 0 52px; height: 30px;
    border: 1px solid rgba(255,255,255,.22); border-radius: 6px;
    background: rgba(255,255,255,.10); color: #eef2ff;
    font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer;
  }
  .mc-send button:disabled { opacity: 0.50; }
  .mc-status { min-height: 12px; margin-top: 3px; font-size: 9px; color: #ff8a8a; }
  .mc-status.ok { color: #9fe6b8; }
  #stack:has(#panel.hidden):has(#queuePanel.hidden) { display: none; }
  #panel {
    padding: 12px 16px 16px;
    transition: opacity .35s ease, border-color .35s ease;
    overflow: hidden;
  }
  #panel.hidden { display: none; }

  /* 歌曲区：封面左、文字右；难度栏在文字列底部，与封面底部对齐 */
  .song { display: flex; gap: 12px; align-items: stretch; margin-top: 20px; }
  .songtext {
    flex: 1 1 auto; min-width: 0;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .title {
    font-size: 26px; font-weight: 700; line-height: 1.3;
    text-shadow: 0 1px 4px rgba(0,0,0,.8);
    overflow: hidden; white-space: nowrap;
  }
  .artist {
    font-size: 15px; color: #b9bfd4; margin-top: auto;
    overflow: hidden; white-space: nowrap; text-align: left;
  }
  .jacket {
    width: 142px; height: 142px; flex: 0 0 142px;
    border-radius: 8px; object-fit: cover;
    background: rgba(255,255,255,.06);
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  .standbyart {
    width: 142px; height: 142px; flex: 0 0 142px;
    border-radius: 8px;
    background: linear-gradient(145deg, #141826 0%, #0a0c14 100%);
    border: 1px solid rgba(255,255,255,.06);
    box-shadow: inset 0 0 32px rgba(0,0,0,.65);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 11px;
  }
  .standbyart .eq { display: flex; gap: 4px; align-items: flex-end; height: 40px; }
  .standbyart .eq i {
    width: 4px; height: 100%; border-radius: 2px;
    background: #596179; transform-origin: bottom;
    animation: eqbar 1.15s ease-in-out infinite;
  }
  .standbyart .eq i:nth-child(1) { animation-delay: -.9s; }
  .standbyart .eq i:nth-child(2) { animation-delay: -.55s; }
  .standbyart .eq i:nth-child(3) { animation-delay: -.25s; }
  .standbyart .eq i:nth-child(4) { animation-delay: -.7s; }
  .standbyart .eq i:nth-child(5) { animation-delay: -.4s; }
  @keyframes eqbar {
    0%, 100% { transform: scaleY(.28); opacity: 0.50; }
    50%      { transform: scaleY(.95); opacity: 1; }
  }
  .standbyart .slogo {
    font-size: 9px; font-weight: 700; letter-spacing: 2.2px;
    color: #5d6680;
  }
  .standby-diffs {
    width: 100%; height: 64px; margin-top: 8px;
    display: flex; gap: 6px;
  }
  .standby-diffs b {
    flex: 1 1 0; display: flex; align-items: center; justify-content: center;
    border: 3px solid rgba(255,255,255,.16); border-radius: 4px;
    background: rgba(255,255,255,.02);
    color: rgba(255,255,255,.22); font-size: 18px; font-weight: 700;
    transform: skewX(-12deg);
  }
  .badges { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .4px;
    padding: 2px 7px; border-radius: 999px;
    background: rgba(255,255,255,.08); color: #c6cbe0;
  }
  .badge.demo { background: rgba(255,90,90,.18); color: #ff6a6a; }
  #srbar {
    display: flex; align-items: center;
    padding: 8px 14px 10px;
  }
  .srtoggle {
    display: inline-flex; align-items: center; gap: 5px;
    border: 1px solid #e6ddcf; border-radius: 999px;
    background: rgba(255,255,255,.85);
    padding: 3px 7px; cursor: pointer; font-family: inherit;
    transition: border-color .45s ease, background .45s ease;
  }
  .srtoggle .lbl {
    font-size: 9px; font-weight: 700; letter-spacing: .3px;
    color: #aeb6cc;
  }
  .srtoggle .sw {
    width: 24px; height: 13px; border-radius: 999px;
    background: rgba(255,255,255,.14); position: relative;
    transition: background .45s ease;
  }
  .srtoggle .sw i {
    position: absolute; left: 2px; top: 2px;
    width: 9px; height: 9px; border-radius: 50%;
    background: #9aa3b8; transition: left .45s ease, background .45s ease;
  }
  .srtoggle.on {
    border-color: rgba(255,255,255,.34);
    background: rgba(255,255,255,.05);
  }
  .srtoggle.on .lbl { color: #e6eaf4; }
  .srtoggle.on .sw { background: #c9d0e0; }
  .srtoggle.on .sw i { left: 13px; background: #11131c; }
  #panel.preview .jacket { filter: brightness(.88); }

  /* 超长曲名 / 曲师：由 JS 统一调度滚动节奏 */
  .marq-inner { display: inline-block; white-space: nowrap; will-change: transform; }
  .title, .artist { transition: opacity .3s ease; }

  /* 切歌：曲名区从左滑入、封面从右滑入（慢→快→慢） */
  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeRow {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  /* 切歌：先淡出 → 换内容 → 左右内滑淡入（慢→快→慢） */
  #panel.song-fade .song,
  #panel.song-fade .diffrow {
    opacity: 0;
    transition: opacity .17s ease;
  }
  #panel.song-in .songtext {
    animation: slideInLeft .36s cubic-bezier(.65, 0, .35, 1) both;
  }
  #panel.song-in .jacket {
    animation: slideInRight .36s cubic-bezier(.65, 0, .35, 1) both;
  }
  #panel.song-in .diffrow {
    animation: fadeRow .32s cubic-bezier(.65, 0, .35, 1) .07s both;
  }
  .jacket { transition: opacity .35s ease, transform .35s ease; }

  /* 6 档难度：平行四边形；绿/黄上下叠成一列以缩短总长 */
  .diffrow {
    display: flex; gap: 8px; margin-top: auto; padding: 9px 0 0;
    align-items: stretch;
    height: 76px;
  }
  .diffstack {
    flex: .78 1 0; min-width: 0;
    display: flex; flex-direction: column; gap: 5px;
  }
  .diffstack .diffseg { flex: 1 1 0; font-size: 15px; }
  .diffseg {
    flex: 1 1 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-width: 0;
    border-radius: 4px;
    padding: 2px;
    font-size: 22px; font-weight: 700;
    letter-spacing: .2px;
    border: 3px solid rgba(255,255,255,.55);
    opacity: 0.50;
    position: relative; overflow: visible;
    transform: skewX(-12deg);
    transition: opacity .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  /* 常用难度（红/紫/黑）更宽更亮 */
  .diffseg[data-d="2"] { flex: 1.10 1 0; opacity: 0.50; }
  .diffseg[data-d="3"] { flex: 1.24 1 0; opacity: 0.50; }
  .diffseg[data-d="4"] { flex: 1.24 1 0; opacity: 0.50; }
  .diffseg[data-d="5"] { flex: 1.10 1 0; opacity: 0.50; }
  /* 内容反向倾斜，保持文字竖直 */
  .diffseg > * { transform: skewX(12deg); }
  /* 定数右上角的上标 + */
  .diffseg .cv { position: relative; display: inline-block; }
  .diffseg .cv sup {
    position: absolute; top: -.32em; right: -.52em;
    font-size: .55em; font-weight: 700; line-height: 1;
    opacity: 0.50;
  }
  /* 只显示定数，不显示难度类别 */
  .diffseg .lv { display: none; }
  .diffseg.we .lv { font-size: 8.5px; letter-spacing: 0; }
  /* 选中难度：纯色平涂 + 同色描边，扁平无纵深 */
  .diffseg.cur {
    opacity: 1;
    border-color: currentColor;
  }
  /* ULTIMA：深棕红斜纹底，和 EXPERT 的亮红边框明显区分 */
  .diffseg.ultima {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.06) 0 2px, rgba(255,255,255,0) 2px 7px),
      linear-gradient(135deg, #43100f 0%, #1c0507 100%) !important;
    color: #b94343 !important;
  }
  .diffseg.ultima.cur {
    background:
      repeating-linear-gradient(135deg, rgba(255,255,255,.07) 0 2px, rgba(255,255,255,0) 2px 7px),
      linear-gradient(135deg, #6b1114 0%, #2b0709 55%, #0a0a0d 100%) !important;
    color: #ff3b3b !important;
  }
  .diffseg.ultima .lv,
  .diffseg.ultima .cv { position: relative; z-index: 1; text-shadow: 0 1px 2px rgba(0,0,0,.75); }
  /* WORLD'S END：彩色渐变 */
  .diffseg.we {
    background: linear-gradient(135deg,#ff5a5a,#ffb03a,#ffd24a,#5aff9a,#58c0ff,#b45aff,#ff5ad8) !important;
    color: #10101a !important;
  }
  .diffseg.we .lv { color: #10101a; opacity: 0.50; }
  /* 没有该难度：不显示 */
  .diffseg.missing { display: none !important; }

  /* 游玩区（待机时收起） */
  .playonly {
    max-height: 420px;
    opacity: 1;
    transition: max-height .55s ease, opacity .4s ease;
    overflow: hidden;
  }
  #panel.state-idle .playonly { max-height: 0; opacity: 0; pointer-events: none; }
  .scoreline, .judges, .feed { transition: opacity .4s ease; }
  #panel.state-play .scoreline { transition-delay: 0ms; }
  #panel.state-play .judges    { transition-delay: 70ms; }
  #panel.state-play .feed      { transition-delay: 140ms; }

  .scoreline {
    display: flex; justify-content: space-between; align-items: baseline;
    border-top: 1px solid rgba(255,255,255,.10);
    margin-top: 12px; padding-top: 10px;
  }
  .score {
    font-size: 32px; font-weight: 800; letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  .combo { font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  /* 连击数字：追平最大值时放大，断连后回落 */
  .combo b {
    color: #fff; font-size: 24px;
    display: inline-block;
    transition: font-size .28s cubic-bezier(.4,0,.2,1), color .28s ease;
  }
  .combo b.full { font-size: 31px; color: #fff; }
  /* 当前连击 = 最大连击时只显示当前值，否则显示 /最大值（带过渡） */
  #maxcombo {
    display: inline-block; overflow: hidden; white-space: nowrap;
    max-width: 9ch; opacity: 1; vertical-align: baseline;
    transition: max-width .3s cubic-bezier(.4,0,.2,1),
                opacity .22s ease, margin-left .3s ease;
  }
  #maxcombo.off { max-width: 0; opacity: 0; margin-left: 0; }

  .judges {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 4px 20px; margin-top: 12px;
    border-top: 1px solid rgba(255,255,255,.08); padding-top: 10px;
  }
  html.skin-game .judges { gap: 5px 8px; }
  /* 基础判定行（classic 皮肤沿用原样） */
  .jcell { display: flex; justify-content: space-between; align-items: baseline; }
  .jcell .l { font-size: 15px; font-weight: 700; letter-spacing: .5px; }
  .jcell.jc .n, .jcell.jc .l { color: var(--jc); }
  .jcell.ju .n, .jcell.ju .l { color: var(--ju); }
  .jcell.at .n, .jcell.at .l { color: var(--at); }
  .jcell.mi .n, .jcell.mi .l { color: var(--mi); }
  /* 判定行：参考结算画面的彩色横条 + 白字 */
  html.skin-game .jcell {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1px 9px 2px; border-radius: 5px;
    background: var(--bar, rgba(255,255,255,.05));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.10),
                0 1px 3px rgba(0,0,0,.45);
  }
  /* 判定区：整块用游戏结算画面的原始贴图（314×233），数字叠在条上 */
  /* JUDGE 卡：与 SCORE 同结构（白卡 + 斜切标签 + 淡黄横条 + 面板贴图） */
  html.skin-game .judges {
    position: relative; display: block; width: auto;
    margin: 16px 0 0; padding: 54px 16px 202px; height: 262px; border: 3px solid #ffffff; border-radius: 16px;
    background-color: rgba(255,253,253,.46);
    background-image:
      linear-gradient(90deg, #00c2ea 0%, #12d8f8 48%, #2fe4ff 100%),
      var(--pat-dots, none),
      var(--pat-stripe, none),
      var(--pat-stripey, none),
      linear-gradient(155deg, rgba(255,253,254,.54) 0%, rgba(247,242,255,.54) 55%, rgba(242,248,255,.54) 100%);
    background-size: 100% 44px, 97px 33px, 85px 44px, 85px 44px, auto;
    background-position: 0 0, left 22px bottom 12px, left -10px top 110px, left 16px bottom 16px, 0 0;
    background-repeat: no-repeat, repeat, repeat-y, no-repeat, no-repeat;
    background-repeat: no-repeat;
    box-shadow: 0 3px 10px rgba(150,120,100,.10);
    overflow: hidden;
  }
  html.skin-game .judges::before {
    content: ''; position: absolute; left: -3px; top: -3px; width: 232px; height: 47px;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,.16) 0 5px, rgba(255,255,255,0) 5px 12px),
      linear-gradient(95deg, #8a4dff 0%, #5f7bff 100%);
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
    border-radius: 16px 0 0 0;
  }
  html.skin-game .judges::after {
    content: 'JUDGE'; position: absolute; left: 20px; top: 0; height: 44px; line-height: 44px;
    font-size: 32px; font-weight: 900; letter-spacing: 1px; color: #fff;
    text-shadow: 0 1px 2px rgba(60,40,140,.35);
  }
  html.skin-game .jinner {
    position: absolute; left: 16px; top: calc(50% + 22px);
    width: 265px; height: 157px;
    transform: translateY(-50%) scale(.9); transform-origin: left center;
    background: var(--panel) no-repeat center / 265px 157px;
  }
  /* 右侧：LATE / FAST 双向条形图（以中线为轴，左偏=late 右偏=fast） */
  html.skin-game .jchart {
    position: absolute; right: 18px; top: calc(50% + 22px);
    width: 250px; transform: translateY(-50%); z-index: 1;
    display: flex; flex-direction: column; gap: 9px;
  }
  html.skin-game .jrow { display: flex; align-items: center; gap: 8px; }
  html.skin-game .jlab {
    width: 22px; font-size: 11px; font-weight: 900; color: #8a7f95;
    letter-spacing: .5px; text-align: right;
  }
  html.skin-game .jtrack {
    position: relative; flex: 1 1 auto; height: 13px; border-radius: 7px;
    background: rgba(120,100,130,.10); overflow: hidden;
  }
  html.skin-game .jaxis {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 1px;
    background: rgba(255,255,255,.9);
  }
  html.skin-game .jbl, html.skin-game .jbr {
    position: absolute; top: 0; bottom: 0; width: 0;
    transition: width .35s cubic-bezier(.3,.8,.3,1);
  }
  html.skin-game .jbl { right: 50%; border-radius: 7px 0 0 7px;
    background: linear-gradient(90deg, #ff9a7a, #f0442c); }
  html.skin-game .jbr { left: 50%; border-radius: 0 7px 7px 0;
    background: linear-gradient(90deg, #2f7dff, #7cc4ff); }
  html.skin-game .jcnt { width: 52px; display: flex; align-items: baseline; gap: 3px; }
  html.skin-game .jcnt b { font-size: 12px; font-weight: 900; font-variant-numeric: tabular-nums; }
  html.skin-game .jcnt .cl { color: #ef5a44; }
  html.skin-game .jcnt .cr { color: #2f7dff; }
  html.skin-game .jcnt em { font-style: normal; font-size: 9px; color: #b6acbd; }
  html.skin-game .jlegend { display: flex; justify-content: space-between; padding-left: 28px; }

    box-shadow: 0 4px 14px rgba(150,115,95,.14);
    backdrop-filter: blur(6px);
  }

  /* SCORE 卡：分数垂直居中放大；评级 + COMBO 在左下角 */
  html.skin-game .scoreline {
    padding: 0; height: 218px;
    flex-direction: row; align-items: center; justify-content: flex-start;
  }
  html.skin-game .scrow {
    position: absolute; left: 20px; right: 20px; top: 56px; bottom: 35px;
    display: flex; align-items: center; transform-origin: left center;
  }
  html.skin-game .scoreline .score {
    position: static; margin: 0; text-align: left; line-height: 0;
    display: flex; align-items: center;
    flex: 0 0 auto; white-space: nowrap;
  }
  html.skin-game .scoreline .score .sd { height: 68px; vertical-align: -6px; margin: 0 1px; }
  html.skin-game .scoreline .score .sd.comma { height: 42px; vertical-align: -12px; margin: 0 2px; }
  html.skin-game .scfoot {
    position: absolute; left: 20px; bottom: 10px;
    display: flex; align-items: center; gap: 14px;
  }
  html.skin-game .rankbox { display: flex; align-items: center; }
  html.skin-game .rankart { display: flex; align-items: flex-end; gap: 0; height: 30px; }
  html.skin-game .rankart img { height: 30px; width: auto; display: block; }
  html.skin-game .rankart img.plus { height: 14px; margin-left: 1px; align-self: flex-start; }
  html.skin-game .rankart.pop { animation: rankPop .36s cubic-bezier(.2,.9,.3,1.25); }
  html.skin-game .rankart.hidden { display: none; }
  @keyframes rankPop {
    0%   { transform: scale(.55); opacity: 0; }
    60%  { transform: scale(1.12); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* 难度块：不透明；选中项用 MATE 主题渐变色描边，播放时渐变色流动 */
  html.skin-game .diffseg,
  html.skin-game .diffseg:not(.ultima):not(.we) {
    opacity: 1 !important;
    border-color: rgba(255,255,255,.92);
    box-shadow: 0 2px 6px rgba(120,80,60,.18);
    transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  html.skin-game .diffrow > .diffseg { font-size: 30px !important; }
  html.skin-game .diffstack .diffseg { font-size: 16px !important; }
  html.skin-game .diffseg {
    position: relative;
  }
  /* 选中难度：加粗白边 + 主题色外圈 + 光晕，明显但不改变尺寸 */
  html.skin-game .diffseg {
    /* 未选中缩小，和选中形成明显落差 */
    transform: skewX(-12deg);
    transition: box-shadow .26s ease, transform .26s ease;
  }
  html.skin-game .diffseg.cur {
    opacity: 1 !important;
    z-index: 3;
    /* 未选中 82% → 选中 110%，并整体上提，明显突出 */
    transform: skewX(-12deg) scale(1.10) translateY(-3px);
    box-shadow: 0 4px 12px rgba(0,0,0,.20);
  }
  /* 游玩中：去掉光晕，改为整体缩放呼吸 */
  html.skin-game #stack.in-game .diffseg.cur {
    animation: curBreath 2.4s ease-in-out infinite;
    box-shadow: 0 4px 10px rgba(0,0,0,.20);
  }
  @keyframes curBreath {
    0%, 100% { transform: skewX(-12deg) scale(1.06) translateY(-2px); }
    50%      { transform: skewX(-12deg) scale(1.14) translateY(-4px); }
  }
  /* 难度色：取自 CHU_UI_playing_00_v11.dds 的 TRACK 条 */
  html.skin-game .diffseg[data-d="0"] { --dc: #04a075; }
  html.skin-game .diffseg[data-d="1"] { --dc: #ec7405; }
  html.skin-game .diffseg[data-d="2"] { --dc: #dc2828; }
  html.skin-game .diffseg[data-d="3"] { --dc: #7b17c3; }
  html.skin-game .diffseg[data-d="4"] { --dc: #17121a; }
  html.skin-game .diffseg:not(.we):not(.ultima) { background: var(--dc) !important; }
  /* 曲绘不做任何透明/压暗处理 */
  html.skin-game .jacket { opacity: 1 !important; filter: none !important; }
  /* 难度块：整体收窄一点，间距也收紧 */
  html.skin-game .diffrow {
    gap: 5px;
    max-width: 84%;
    height: 70px;
  }
  html.skin-game .diffstack { gap: 4px; }
  /* 难度块：白边加粗 */
  html.skin-game .diffseg {
    border-width: 5px !important;
    border-color: #ffffff !important;
  }
  /* 难度块：等宽等高、等距、居中对齐 */
  html.skin-game .diffrow {
    gap: 6px;
    height: 86px;
    align-items: stretch;
  }
  html.skin-game .diffstack { gap: 3px; }
  html.skin-game .diffrow > .diffseg,
  html.skin-game .diffstack {
    flex: 1 1 0 !important;
    min-width: 0;
  }
  html.skin-game .diffseg {
    transform-origin: center center;
  }
  html.skin-game .diffseg.cur {
    transform: skewX(-12deg) scale(1.08);
  }
  html.skin-game #stack.in-game .diffseg.cur {
    animation: curBreath 2.4s ease-in-out infinite;
  }
  @keyframes curBreath {
    0%, 100% { transform: skewX(-12deg) scale(1.04); }
    50%      { transform: skewX(-12deg) scale(1.12); }
  }
  /* 连击徽章：放在评级字母后面，固定槽位，与评级底对齐 */
  html.skin-game .scfoot { gap: 0; }
  html.skin-game .rankbox {
    width: 94px; flex: 0 0 94px;
    display: flex; align-items: flex-end;
  }
  html.skin-game .cmslot {
    width: 136px; height: 24px; margin-left: 12px;
    display: flex; align-items: flex-end; justify-content: flex-start;
  }
  html.skin-game .cmslot img {
    height: 24px; width: auto; display: block;
    filter: drop-shadow(0 1px 2px rgba(120,70,50,.28));
  }
  html.skin-game .scfoot .combo { margin-left: 12px; }
  /* COMBO 标签：与曲名同一套字体 */
  html.skin-game .combo,
  html.skin-game .combo b,
  html.skin-game #maxcombo {
    font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px;
    line-height: 1.1;
  }
  html.skin-game .combo {
    display: inline-flex; align-items: baseline; gap: 6px;
    color: #1c1b22;
  }
  html.skin-game .cmlbl { color: #1c1b22; }
  html.skin-game .combo b { color: #1c1b22; }
  html.skin-game #maxcombo { color: #8b8691; font-size: 18px; }
  /* 待机（没有曲目）时：不显示空的 SCORE / JUDGE 卡片 */
  html.skin-game #panel.standby .playonly { display: none; }
  /* COMBO 标签：直接使用游戏图集里的 COMBO 字形（遮罩染成文字色） */
  html.skin-game .cmlbl {
    display: inline-block; width: 101px; height: 22px;
    background: currentColor;
    -webkit-mask: var(--cw, none) no-repeat center / contain;
    mask: var(--cw, none) no-repeat center / contain;
  }
  html.skin-game .cmlbl.glyph { color: #1c1b22; }
</style>
</head>

<script>
(function () {
  'use strict';
  // 皮肤：默认 game（游戏字体 + 彩色判定条），?skin=classic 为原版
  var SKIN_CLASSIC = location.search.indexOf('skin=classic') >= 0;
  if (!SKIN_CLASSIC) document.documentElement.className += ' skin-game';
  // 原版皮肤保留 EARLY 文案；game 皮肤用游戏里的 FAST
  if (SKIN_CLASSIC) {
    var fastChip = document.querySelector('.flchip.fast');
    if (fastChip && fastChip.firstChild) fastChip.firstChild.nodeValue = 'EARLY ';
  }
  var ua = navigator.userAgent || '';
  var phoneUA = /iPhone|iPod|iPad|Tablet|Windows Phone|Android.*Mobile|Mobile/i.test(ua);
  var touchNarrow = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches &&
                       window.innerWidth <= 1024);
  if (phoneUA || touchNarrow) document.documentElement.classList.add('mobile');
  var $ = function (id) { return document.getElementById(id); };
  var panel = $('panel'), feedEl = $('feed');
  if (!feedEl) feedEl = document.createElement('div'); // 判定流已移除，占位避免空引用
  var srToggleEl = $('srToggle');
  var queuePanel = $('queuePanel'), qnormalEl = $('qnormal'),
      qselectEl = $('qselect'), qminisEl = $('qminis'), qchoicesEl = $('qchoices'),
      qmsgEl = $('qmsg'), mcListEl = $('mcList');
  // 队列卡并入面板，保证与 SCORE / JUDGE 同一层、同一内距
  if (queuePanel && panel && queuePanel.parentNode !== panel) panel.appendChild(queuePanel);
  // 点歌板开关并入队列卡右上角
  if (queuePanel && $('srbar')) queuePanel.insertBefore($('srbar'), queuePanel.firstChild);
  var mcInputEl = $('mcInput'), mcSendEl = $('mcSend'), mcStatusEl = $('mcStatus');
  var lastChatSig = '';
  var qEls = {}, qSlots = [], qMoreEl = null;
  var tipEl = $('tip'), dragState = null, dragGuardUntil = 0;
  var lastQueueItems = [], queueHoverId = 0, queueFan = false, queueFanTimer = 0;
  var currentPlayDiff = -1;
  var lastSelectSig = '';
  var lastQueueSig = null;
  var choiceScrollTimer = 0;
  var choiceScrollRAF = 0;
  var lastQNotice = '';
  var API = (location.protocol === 'file:') ? 'http://127.0.0.1:8770' : '';

  var DIFF_NAMES = ['BASIC', 'ADVANCED', 'EXPERT', 'MASTER', 'ULTIMA', "WORLD'S END"];
  var DIFF_COLORS = ['#5aff9a', '#ffb03a', '#ff5a3c', '#b45aff', '#ff3b3b', '#ff5ad8'];
  // 点歌卡片/候选区配色：ULTIMA 与上方难度框一致（棕红）
  function hexA(hex, a) {
    var h = String(hex).replace('#', '');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var n = parseInt(h, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  var QDIFF_COLORS = DIFF_COLORS.slice();
  QDIFF_COLORS[4] = '#e8eaf0';
  var SHORT = { JUSTICE_CRITICAL: 'JC', JUSTICE: 'JU', ATTACK: 'AT', MISS: 'MI' };

  var lastEvent = 0, lastInGame = false, lastSongId = -1, lastSongChange = 0, lastShown = false;

  // 封面加载失败时带时间戳重试一次（绕过浏览器对旧 404 的缓存）
  (function () {
    var jk = document.getElementById('jacket');
    if (!jk) return;
    jk.addEventListener('error', function () {
      var mid = jk.getAttribute('data-mid');
      if (!mid || jk.getAttribute('data-retry')) return;
      jk.setAttribute('data-retry', '1');
      jk.src = API + '/jacket/' + mid + '.png?r=' + Date.now();
    });
  })();

  function pad(n) {
    var v = Number(n) || 0;
    return v < 10 ? '0' + v : String(v);
  }

  // —— 皮肤：默认 game（游戏内字体）；?skin=classic 回到原版字体 ——
  var SKIN = (location.search.indexOf('skin=classic') >= 0) ? 'classic' : 'game';
  var SCORE_D = null, JD = null, RANK_IMG = null, DECO2 = null;
  if (SKIN === 'game') {
    // 数字按游戏实际字号取对应 RFZ 位图（18/24/32pt 原生尺寸，1:1 不缩放）
    var DGS = { 18: null, 24: null, 32: null };
    [18, 24, 32].forEach(function (sz) {
      fetch('glyphs' + sz + '.json').then(function (r) { return r.json(); })
        .then(function (j) { DGS[sz] = j; }).catch(function () {});
    });
    fetch('deco.json').then(function (r) { return r.json(); }).then(function (j) {
      var de = document.documentElement;
      if (j.star) de.style.setProperty('--deco-star', 'url(' + j.star.m + ')');
      if (j.bolt) de.style.setProperty('--deco-bolt', 'url(' + j.bolt.m + ')');
      if (j.squig) de.style.setProperty('--deco-squig', 'url(' + j.squig.m + ')');
    }).catch(function () {});
    fetch('logo.json').then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.m) $('blogo').src = j.m; }).catch(function () {});
    fetch('patterns.json').then(function (r) { return r.json(); }).then(function (j) {
      var de = document.documentElement;
      if (j.dots) de.style.setProperty('--pat-dots', 'url(' + j.dots.m + ')');
      if (j.stripe) de.style.setProperty('--pat-stripe', 'url(' + j.stripe.m + ')');
      if (j.stripey) de.style.setProperty('--pat-stripey', 'url(' + j.stripey.m + ')');
    }).catch(function () {});

    fetch('judge_digits.json').then(function (r) { return r.json(); })
      .then(function (j) { JD = j; }).catch(function () {});
    // COMBO 标签：CHU_UI_Select_optionbox 里的官方字形
    fetch('combo_word.json').then(function (r) { return r.json(); })
      .then(function (j) {
        window.COMBO_WORD = j;
        var el = document.getElementById('cmlbl');
        if (el && j && j.m) {
          el.style.setProperty('--cw', 'url(' + j.m + ')');
          el.textContent = '';
          el.classList.add('glyph');
        }
      }).catch(function () {});
    fetch('score_digits.json').then(function (r) { return r.json(); })
      .then(function (j) { SCORE_D = j.chars; }).catch(function () {});
    // 评级字母（CHU_UI_Result_Rank_00 原素材）
    fetch('rank.json').then(function (r) { return r.json(); })
      .then(function (j) {
        RANK_IMG = j;
        var a = $('rankart');
        if (a) { a._rk = null; if (a._rkTxt) a.innerHTML = rankHTML(a._rkTxt); }
        fitScore();
      }).catch(function () {});
    // 装饰素材（CHU_UI_Common_BK_01 / BK_02）
    fetch('deco2.json').then(function (r) { return r.json(); })
      .then(function (j) {
        DECO2 = j;
        var st = document.getElementById('stack');
        if (!st || !j) return;
        st.style.setProperty('--d1', 'url(' + j.star.m + ')');
        st.style.setProperty('--d2', 'url(' + j.squig.m + ')');
        st.style.setProperty('--d3', 'url(' + j.plus.m + ')');
        st.style.setProperty('--d4', 'url(' + j.bolt.m + ')');
        st.style.setProperty('--d5', 'url(' + j.tri.m + ')');
        st.style.setProperty('--d6', 'url(' + j.star2.m + ')');
        st.style.setProperty('--d7', 'url(' + j.zig.m + ')');
        st.style.setProperty('--d8', 'url(' + j.spark.m + ')');
        st.style.setProperty('--d9', 'url(' + j.square.m + ')');
      }).catch(function () {});
    // 判定行底图：直接切自游戏结算画面的贴图
    fetch('judge_rows.json').then(function (r) { return r.json(); })
      .then(function (j) {
        var jd = document.querySelector('.judges');
        if (jd && j.panel) jd.style.setProperty('--panel', 'url(' + j.panel.m + ')');
      }).catch(function () {});
  }

  function glyphHTML(s, j) {
    var out = '';
    for (var i = 0; i < s.length; ++i) {
      var c = s.charAt(i), g = j && j.chars[c];
      if (!g) { out += c; continue; }
      out += '<i class="dg" style="--m:url(\'' + g.m + '\');' +
             'width:' + g.w + 'px;height:' + g.h + 'px;' +
             'vertical-align:' + (-(g.h - j.ascent)) + 'px"></i>';
    }
    return out;
  }

  // 游戏里的数字都是图集里的“金属数字”贴图（白→灰渐变 + 镀层边）
  function setDig(el, v, cls) {
    var str = String(v);
    if (!SCORE_D) { if (el.innerHTML !== str) el.innerHTML = str; return; }
    if (el._dv === str && el._dc === cls) return;
    el._dv = str; el._dc = cls;
    var out = '';
    for (var i = 0; i < str.length; ++i) {
      var c = str.charAt(i), g = SCORE_D[c];
      out += g ? '<img class="' + cls + (c === ',' ? ' comma' : '') + '" data-c="' + c + '" src="' + g.m + '" alt="">' : c;
    }
    el.innerHTML = out;
  }
  function fmtScore(n) {
    var t = String(n), out = '', c = 0;
    for (var i = t.length - 1; i >= 0; --i) {
      out = t.charAt(i) + out;
      if (++c % 3 === 0 && i > 0) out = ',' + out;
    }
    return out;
  }
  // 评级贴图拼接
  function rankHTML(name) {
    if (!RANK_IMG) return '';
    var out = '', i, ch;
    for (i = 0; i < name.length; ++i) {
      ch = name.charAt(i);
      if (ch === '+') { out += '<img class="plus" src="' + RANK_IMG.plus.m + '" alt="">'; continue; }
      var g = RANK_IMG[ch];
      out += g ? '<img src="' + g.m + '" alt="">' : ch;
    }
    return out;
  }

  // 分数整行按卡片宽度等比缩放
  function fitScore() {
    var card = document.querySelector('.scoreline');
    var row = document.querySelector('.scrow');
    if (!card || !row) return;
    row.style.transform = '';
    var avail = card.clientWidth - 40;
    var w = row.scrollWidth || row.offsetWidth;

  window.addEventListener('resize', function () { try { fitScore(); } catch (e) {} });

  function setScore(el, v) { setDig(el, fmtScore(v | 0), 'sd'); }
  // 每个判定行用游戏里对应颜色的数字贴图（JC 金青 / JU 橙 / AT 绿 / MISS 银）
  function setJudge(el, v, setName, cls) {

    var set = JD && JD[setName];
    if (!set) { if (el.innerHTML !== str) el.innerHTML = str; return; }
    var key = setName + '|' + str + '|' + cls;

    var str = String(v), out = '<i class="mslash">/</i>';

      out += g ? '<img class="sd mc" src="' + g.m + '" alt="">' : c;

  function setGlyph(el, v, size) {
    var j = (typeof DGS === 'undefined') ? null : DGS[size || 24];
    var s = String(v);
    if (j && el._gv === s && el._gs === size) return;
    el._gv = j ? s : null;
    el._gs = size;
    el.innerHTML = j ? glyphHTML(s, j) : s;

  // 把 #rrggbb 按比例压暗
  function shade(hex, f) {
    var n = parseInt(hex.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * f);
    var g = Math.round(((n >> 8) & 255) * f);
    var b = Math.round((n & 255) * f);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }

  // —— 同步滚动调度 ——
  // 规则：起始停顿 1s → 各自滚动（先到的停在终点等待）→ 结束停顿 1s
  //       → 淡出 → 复位 → 淡入 → 新一轮
  var MARQ_SPEED = 40;      // px/s
  var MARQ_PAUSE = 1000;    // 首尾停顿
  var MARQ_FADE = 320;      // 淡出/淡入时长
  var marqTimer = null;
  var marqItems = [];
  var marqSigLast = '';

  function marqStop() {
    if (marqTimer) { clearTimeout(marqTimer); marqTimer = null; }
    for (var i = 0; i < marqItems.length; ++i) {
      var m = marqItems[i];
      m.inner.style.transition = 'none';
      m.inner.style.transform = 'translateX(0)';
      m.el.style.opacity = '';
    }
    marqItems = [];
  }

  // 为单个元素建立滚动描述；不需要滚动的直接返回 null，完全不管它
  function marqBuild(el, text) {
    if (!el) return null;
    var key = text + '|' + el.clientWidth;
    if (el.getAttribute('data-marq') !== key) {
      el.setAttribute('data-marq', key);
      // 先用纯文本测量
      el.textContent = text;
      el.style.opacity = '1';
      var over = el.scrollWidth - el.clientWidth;
      if (over > 4) {
        // 只有真正溢出时才建立滚动结构
        el.textContent = '';
        var sp = document.createElement('span');
        sp.className = 'marq-inner';
        sp.textContent = text;
        el.appendChild(sp);
      }
    }
    var inner = el.querySelector('.marq-inner');
    if (!inner) return null;              // 放得下 → 不参与滚动调度
    var dist = Math.max(0, inner.scrollWidth - el.clientWidth);
    if (dist <= 4) return null;
    var dur = Math.max(1200, Math.round(dist / MARQ_SPEED * 1000));
    return { el: el, inner: inner, dist: dist, dur: dur };
  }

  function marqStart(items) {
    marqStop();
    var moving = [];
    for (var i = 0; i < items.length; ++i) {
      var m = items[i];
      if (!m) continue;
      if (m.dist > 4) { moving.push(m); }
      else { m.inner.style.transition = 'none'; m.inner.style.transform = 'translateX(0)'; }
    }
    if (!moving.length) return;
    marqItems = moving;

    // 统一周期取最长者，短的那个滚完后原地等待
    var maxDur = 0;
    for (var k = 0; k < moving.length; ++k) maxDur = Math.max(maxDur, moving[k].dur);

    function round() {
      // 1) 复位 + 停顿 1s（可见）
      for (var i = 0; i < moving.length; ++i) {
        var m = moving[i];
        m.inner.style.transition = 'none';
        m.inner.style.transform = 'translateX(0)';
        m.el.style.opacity = '1';
      }
      marqTimer = setTimeout(function () {
        // 2) 滚动：各自按自身时长
        for (var i = 0; i < moving.length; ++i) {
          var m = moving[i];
          m.inner.style.transition = 'transform ' + m.dur + 'ms linear';
          m.inner.style.transform = 'translateX(-' + m.dist + 'px)';
        }
        marqTimer = setTimeout(function () {
          // 3) 结束停顿 1s
          marqTimer = setTimeout(function () {
            // 4) 淡出 → 复位 → 淡入 → 下一轮
            for (var i = 0; i < moving.length; ++i) moving[i].el.style.opacity = '0';
            marqTimer = setTimeout(round, MARQ_FADE);
          }, MARQ_PAUSE);
        }, maxDur);
      }, MARQ_PAUSE);
    }
    round();
  }

  function setMarquee(el, text) {
    // 兼容旧调用：单元素独立滚动
    marqStart([marqBuild(el, text)]);
  }

    feedEl.appendChild(chip);

  function applySongInfo(song, g) {
    panel.classList.remove('standby');
    $('standbyArt').style.display = 'none';
    // 曲名与曲师同步起滚；仅在文本/宽度变化时重建，避免每帧重启
    var titleText = (song.known && song.title) ? song.title : ('Music #' + g.music_id);
    var artistText = (song.known && song.artist) ? song.artist : '';
    var marqSig = titleText + '\u0001' + artistText + '\u0001' + $('title').clientWidth;
    if (marqSig !== marqSigLast) {
      marqSigLast = marqSig;
      marqStop();
      marqStart([
        marqBuild($('title'), titleText),
        marqBuild($('artist'), artistText)
      ]);
    }

    var jk = $('jacket');
    if (song.known && g.music_id > 0) {
      var want = API + '/jacket/' + g.music_id + '.png';
      if (jk.getAttribute('data-mid') !== String(g.music_id)) {
        jk.setAttribute('data-mid', String(g.music_id));
        jk.removeAttribute('data-retry');
        jk.setAttribute('src', want);
      }
      jk.style.display = '';
    } else {
      jk.style.display = 'none';
      jk.removeAttribute('src');
      jk.removeAttribute('data-mid');
    }

    var consts = (song.known && song.consts) ? song.consts : [];
    var row = $('diffrow');
    if (!row.__segs) {
      row.innerHTML = '';
      var stack = document.createElement('div');
      stack.className = 'diffstack';
      var segs = [];
      for (var k = 0; k < 6; ++k) {
        var seg0 = document.createElement('div');
        seg0.className = 'diffseg';
        seg0.setAttribute('data-d', k);
        seg0.innerHTML = '<span class="lv">' + DIFF_NAMES[k] + '</span><span class="cv"></span>'
;
        if (k < 2) stack.appendChild(seg0); else row.appendChild(seg0);
        segs.push(seg0);
      }
      row.insertBefore(stack, row.firstChild);
      row.__segs = segs;
    }
    var segs = row.__segs;
    var dIdx = Number(g.difficulty);
    var curValid = (dIdx >= 0 && dIdx <= 5);
    var curColor = null;
    for (var i = 0; i < 6; ++i) {
      var seg = segs[i];
      var cval = (consts.length > i && consts[i] != null) ? String(consts[i]) : '';
      if (cval.indexOf('.') >= 0) cval = cval.replace(/0+$/, '').replace(/\.$/, '');
      if (i === 5 && song.we_tag) cval = String(song.we_tag);
      var missing = !cval;
      // 定数带 .5 以上时，右上角加一个上标 +
      var cvEl = seg.querySelector('.cv');
      if (missing) {
        cvEl.textContent = '';
      } else {
        var fv = parseFloat(cval);
        var hasPlus = !isNaN(fv) && (fv - Math.floor(fv)) >= 0.5 - 1e-6;
        cvEl.innerHTML = cval + (hasPlus ? '<sup>+</sup>' : '');
      }

      var special = (i === 4) ? ' ultima' : (i === 5) ? ' we' : '';
      var isCur = curValid && i === dIdx;
      seg.className = 'diffseg' + special + (missing ? ' missing' : '') + (isCur ? ' cur' : '');
      if (special) {
        seg.style.color = '';
        seg.style.background = '';
      } else if (missing) {
        seg.style.color = '';
        seg.style.background = '';
      } else if (isCur) {
        // 选中格：纯色平涂（加深一档），不做渐变
        seg.style.color = DIFF_COLORS[i];
        seg.style.background = shade(DIFF_COLORS[i], .42);
      } else {
        seg.style.color = DIFF_COLORS[i];
        seg.style.background = DIFF_COLORS[i] + '2E';
      }
      if (isCur) curColor = DIFF_COLORS[i];
    }


    panel.style.borderColor = curColor ? curColor + '80' : 'rgba(255,255,255,0.10)';
  }

  function showQNotice(n) {
    var text = n.msg || '';
    if (!text) {
      if (n.status === 'added') text = '已加入：' + n.title;
      else if (n.status === 'duplicate') text = '已在队列：' + n.title;
      else if (n.status === 'not_found') text = '未找到：' + n.query;
      else if (n.status === 'full') text = '队列已满：' + n.title;

    var err = ['not_found', 'full', 'denied', 'usage', 'no_request', 'diff_missing',

  }

  var DIFF_SHORT = ['BASIC', 'ADV', 'EXP', 'MAST', 'ULT', 'WE'];

  function escHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function fmtConst(v) {
    var n = Number(v);
    return (Math.round(n * 10) / 10).toString();
  }

  function tipHtml(d, isCandidate) {
    var h = '<div class="tt">' + escHtml(d.title || '') + '</div>';
    if (d.artist) h += '<div class="ta">' + escHtml(d.artist) + '</div>';
    if (d.version) h += '<div class="tr"><b>版本</b><span>' + escHtml(d.version) + '</span></div>';
    if (d.genre) h += '<div class="tr"><b>分类</b><span>' + escHtml(d.genre) + '</span></div>';
    if (isCandidate && d.difficulty >= 0) {
      var cv = (d.consts && d.consts[d.difficulty] != null) ? d.consts[d.difficulty] : 0;
      h += '<div class="td">' + DIFF_NAMES[d.difficulty] +
           (cv > 0 ? ' ' + fmtConst(cv) : '') + '</div>';
    } else if (!isCandidate && d.difficulty >= 0) {
      h += '<div class="td">' + DIFF_NAMES[d.difficulty] +
           (d.const > 0 ? ' ' + fmtConst(d.const) : '') + '</div>';
    }
    return h;
  }

  function showTip(el, data, isCandidate) {
    if (!el || !data) return;
    if (tipEl.__el === el) return;
    tipEl.__el = el;
    tipEl.innerHTML = tipHtml(data, isCandidate);
    tipEl.classList.add('show');
    var r = el.getBoundingClientRect();
    var tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    var left = Math.max(8, Math.min(window.innerWidth - tw - 8, r.left));
    var top = r.top - th - 6;
    if (top < 8) top = r.bottom + 6;
    if (top + th > window.innerHeight - 8) top = Math.max(8, window.innerHeight - th - 8);
    tipEl.style.left = left + 'px';
    tipEl.style.top = top + 'px';
  }

  function hideTip() {
    tipEl.classList.remove('show');
    tipEl.__el = null;
  }

  function postAction(url) {
    fetch(url, { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok) pollState(); })
      .catch(function () {});
  }

  // 队列卡片布局：普通 4 张；悬停时选中卡展开到 2/3，其余卡右侧叠放后扇形展开
  function layoutQueue() {
    var qnoneEl = document.getElementById('qnone');
    if (!lastQueueItems.length) {
      if (qnormalEl.children.length) qnormalEl.innerHTML = '';
      if (qnoneEl) qnoneEl.classList.remove('hidden');
      return;
    }
    if (qnoneEl) qnoneEl.classList.add('hidden');
    var W = qnormalEl.clientWidth || 542;
    var H = 166, gap = 10;
    var more = lastQueueItems.length > 4;
    var cardW = Math.floor((W - 3 * gap - (more ? 34 : 0)) / 4);
    if (cardW < 80) cardW = 80;
    var hover = queueHoverId;
    if (hover) {
      var found = false;
      for (var h = 0; h < lastQueueItems.length; ++h) {
        if (lastQueueItems[h].id === hover) { found = true; break; }
      }
      if (!found) { queueHoverId = 0; hover = 0; }
    }
    var other = 0;
    for (var i = 0; i < 4; ++i) {
      var el = qnormalEl.children[i];
      if (!el) continue;
      var isCard = el.dataset && el.dataset.reqId;
      if (isCard && Number(el.dataset.reqId) === hover) {
        el.classList.add('expanded');
        el.classList.remove('stacked');
        el.classList.remove('fan');
        el.style.left = '0px';
        el.style.top = '0px';
        el.style.width = Math.round(W * 0.68) + 'px';
        el.style.height = H + 'px';
        el.style.transform = '';
        el.style.zIndex = '30';
        el.style.opacity = '1';
        el.style.pointerEvents = 'auto';
        el.style.transitionDelay = '0ms';
      } else if (hover) {
        el.classList.remove('expanded');
        if (!isCard) {
          el.style.opacity = '0';
          el.style.pointerEvents = 'none';
          continue;
        }
        var j = other++;
        el.classList.add('fan');
        if (j > 0) el.classList.add('stacked'); else el.classList.remove('stacked');
        var fanStep = 50;
        var left = W - cardW - 10 - (queueFan ? j * 10 : 0);
        var top = 2 + (queueFan ? j * 4 : 0);
        el.style.left = left + 'px';
        el.style.top = top + 'px';
        el.style.width = cardW + 'px';
        el.style.height = (H - 8) + 'px';
        el.style.transform = 'rotate(' + (queueFan ? (j - 1) * 4 : 0) + 'deg)';
        el.style.zIndex = String(12 - j);
        el.style.opacity = '1';
        el.style.pointerEvents = 'none';
        el.style.transitionDelay = queueFan ? (j * fanStep) + 'ms' : '0ms';
      } else {
        el.classList.remove('expanded');
        el.classList.remove('stacked');
        el.classList.remove('fan');
        el.style.left = (i * (cardW + gap)) + 'px';
        el.style.top = '0px';
        el.style.width = cardW + 'px';
        el.style.height = H + 'px';
        el.style.transform = '';
        el.style.zIndex = '1';
        el.style.opacity = '1';
        el.style.pointerEvents = 'auto';
        el.style.transitionDelay = '0ms';
      }
    }
    if (qMoreEl) {
      qMoreEl.style.right = '0px';
      qMoreEl.style.top = '0px';
      qMoreEl.style.height = H + 'px';
      qMoreEl.style.opacity = hover ? '0' : '1';
      qMoreEl.style.pointerEvents = hover ? 'none' : 'auto';
    }
  }

  function closeQueueHover(fast) {

    // 长按拖动 = 准备自定义排序：先回弹到标准布局

    dragState = { type: 'queue', id: card.dataset.reqId };
    dragGuardUntil = Date.now() + 500;
    card.classList.add('dragging');

      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', card.dataset.reqId);

    var d = qnormalEl.querySelector('.dragging');

    var o = qnormalEl.querySelector('.drag-over');
    if (o) o.classList.remove('drag-over');
    dragState = null;
  });
  qnormalEl.addEventListener('dragover', function (e) {
    if (!dragState || dragState.type !== 'queue') return;
    e.preventDefault();
    var card = e.target.closest ? e.target.closest('.qslot') : null;
    var old = qnormalEl.querySelector('.drag-over');
    if (old && old !== card) old.classList.remove('drag-over');
    if (card) card.classList.add('drag-over');

  qnormalEl.addEventListener('drop', function (e) {
    if (!dragState || dragState.type !== 'queue') return;
    e.preventDefault();
    var card = e.target.closest ? e.target.closest('.qslot') : null;
    var kids = Array.prototype.slice.call(qnormalEl.children);
    var index = card ? kids.indexOf(card) : -1;
    if (index >= 0 && index < 4) {
      postAction('/queue/move?id=' + encodeURIComponent(dragState.id) + '&to=' + index);
    }
    var o = qnormalEl.querySelector('.drag-over');
    if (o) o.classList.remove('drag-over');
    dragState = null;

  qnormalEl.addEventListener('click', function (e) {
    if (Date.now() < dragGuardUntil) return;
    var b = e.target.closest ? e.target.closest('.qdel') : null;
    if (b) {
      e.stopPropagation();
      var delCard = b.closest('.qslot');
      if (delCard && delCard.dataset.reqId)
        postAction('/queue/remove?id=' + encodeURIComponent(delCard.dataset.reqId));
      return;
    }
    var card = e.target.closest ? e.target.closest('.qslot') : null;
    if (!card || card.classList.contains('empty') || !card.dataset.reqId) return;
    var id = Number(card.dataset.reqId);
    if (queueHoverId === id) {
      closeQueueHover(false);
      return;

    queueHoverId = id;
    queueFan = false;
    clearTimeout(queueFanTimer);
    layoutQueue();

        layoutQueue();
      }
    }, 440);

  qchoicesEl.addEventListener('dragover', function (e) {

  function renderCard(card, it) {

      card.style.setProperty('--dband', hexA(col, diff === 4 ? 0.22 : 0.30));
      card.style.setProperty('--dc', accent);

      qd.textContent = DIFF_NAMES[diff];
      var cval = (it['const'] !== null && it['const'] !== undefined) ? Number(it['const']) : 0;
      if (cval > 0) qd.textContent += ' ' + (Math.round(cval * 10) / 10).toString();
    } else {
      card.classList.remove('diff');
      card.classList.add('no-diff');

      card.style.setProperty('--rc', currentPlayDiff === 4 ? '#ff4a4a' : QDIFF_COLORS[currentPlayDiff]);
    }
    card.classList.toggle('ultima', diff === 4);

  function renderSlots(items, max) {
    lastQueueItems = items || [];
    var seen = {};
    for (var i = 0; i < 4; ++i) {
      var el;
      if (i < items.length) {
        var it = items[i], key = String(it.id);
        el = qEls[key];
        if (!el) {
          el = newCard();
          qEls[key] = el;
        }
        renderCard(el, it);
        el.dataset.key = 'r' + key;
        seen[key] = true;
      } else {
        el = qSlots[i];
        if (!el) {
          el = emptySlot();
          qSlots[i] = el;
        }
        el.dataset.key = 'e' + i;
      }
      if (qnormalEl.children[i] !== el) qnormalEl.insertBefore(el, qnormalEl.children[i] || null);
    }
    while (qnormalEl.children.length > 4) {
      var extra = qnormalEl.children[4];
      if (extra === qMoreEl) break;
      qnormalEl.removeChild(extra);
    }
    for (var k in qEls) {
      if (!seen[k]) {
        if (qEls[k].parentNode) qEls[k].parentNode.removeChild(qEls[k]);
        delete qEls[k];
      }
    }
    // 重排 FLIP 动画已由 qslot 的 left/top/width 过渡接管
    var more = items.length - 4;
    if (more > 0) {
      if (!qMoreEl) {
        qMoreEl = document.createElement('div');
        qMoreEl.className = 'qmore';
      }
      qMoreEl.textContent = '+' + more;
      if (qnormalEl.lastChild !== qMoreEl) qnormalEl.appendChild(qMoreEl);
    } else if (qMoreEl && qMoreEl.parentNode) {
      qMoreEl.parentNode.removeChild(qMoreEl);
    }
    layoutQueue();
  }

  function startChoiceScroll(track, total) {
    cancelAnimationFrame(choiceScrollRAF);
    clearTimeout(choiceScrollTimer);
    var viewport = qchoicesEl.clientHeight || 166;
    var max = track.scrollHeight - viewport;
    if (max <= 0) return;
    var offset = 0;
    var last = 0;
    var speed = 18;          // px/s，匀速
    function frame(now) {
      if (!last) last = now;
      var dt = Math.min(64, now - last) / 1000;
      last = now;
      offset += speed * dt;
      if (offset >= max) {
        track.style.transform = 'translate3d(0,' + (-max) + 'px,0)';
        track.style.opacity = '0';
        choiceScrollTimer = setTimeout(function () {
          track.style.transition = 'none';
          track.style.transform = 'translate3d(0,0,0)';
          offset = 0;
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              track.style.transition = '';
              track.style.opacity = '1';
              last = 0;
              choiceScrollTimer = setTimeout(function () {
                last = 0;
                choiceScrollRAF = requestAnimationFrame(frame);
              }, 1600);
            });
          });
        }, 320);
        return;
      }
      track.style.transform = 'translate3d(0,' + (-offset) + 'px,0)';
      choiceScrollRAF = requestAnimationFrame(frame);
    }
    // 先停留一下，让观众看完前 3 条再开始匀速滚动
    choiceScrollTimer = setTimeout(function () {
      last = 0;
      choiceScrollRAF = requestAnimationFrame(frame);
    }, 2000);
  }

    mcSendEl.disabled = true;

  function applyState(s) {
    if (!s || !s.game) return;
    var g = s.game, song = s.song || {};
    currentPlayDiff = (typeof g.difficulty === 'number') ? g.difficulty : -1;
    applyQueue(s.request, s.pending);
    applyMobileChat(s.chat);
    var srOn = !!(s.request && s.request.enabled);
    srToggleEl.classList.toggle('on', srOn);
    var inGame = !!g.in_game || !!s.demo;
    // 播放中：选中难度块的边框渐变色开始流动
    var stackEl = document.getElementById('stack');
    if (stackEl) stackEl.classList.toggle('in-game', !!inGame);
    lastInGame = inGame;
    var hasSong = !!song.known && g.music_id > 0;

    $('demobadge').style.display = s.demo ? '' : 'none';

    if (!inGame && !hasSong) {
      if (!standbyMode) {
        standbyMode = true;
        setStandby();
      }
    } else {
      standbyMode = false;
      panel.classList.toggle('preview', !inGame);
      // 换歌：先淡出，170ms 后换内容再淡入
      if (song.known && g.music_id !== lastSongId) {
        lastSongId = g.music_id;
        lastSongChange = Date.now();
        feedEl.innerHTML = '';
        lastEvent = 0;
        swapLocked = true;
        panel.classList.add('song-fade');
        (function (ss, gg) {
          setTimeout(function () {
            if (standbyMode) return;
            applySongInfo(ss, gg);
            swapLocked = false;
            panel.classList.remove('song-fade');
            panel.classList.add('song-in');
            setTimeout(function () { panel.classList.remove('song-in'); }, 460);
          }, inGame ? 170 : 40);
        })(song, g);
      }
      if (!swapLocked) applySongInfo(song, g);
    }

    // 选歌界面的历史最佳（Hooked；换曲由插件清零）
    (function () {
      var be = $('bestbadge'), bs = g.best_score | 0;
      if (!be) return;
      if (bs > 0) {
        be.style.display = '';
        be.textContent = 'BEST ' + bs.toLocaleString('en-US');
      } else {
        be.style.display = 'none';
      }
    })();

    setScore($('score'), g.score | 0);
    var cNow = g.combo | 0, mcNow = g.max_combo | 0;
    setDig($('combo'), cNow, 'sd cmb');
    // 追平最大连击 → 数字放大强调
    $('combo').classList.toggle('full', mcNow > 0 && cNow >= mcNow);
    var mxe = $('maxcombo');
    setMaxCombo(mxe, mcNow);
    // 当前连击已达最大值 → 收起分母；否则显示 combo / max
    mxe.classList.toggle('off', !(mcNow > 0 && cNow < mcNow));
    setJudge($('jc'), g.justice_crit | 0, 'jc', 'jd');
    setJudge($('ju'), g.justice | 0, 'ju', 'jd');
    setJudge($('at'), g.attack | 0, 'at', 'jd');
    setJudge($('mi'), g.miss | 0, 'mi', 'jd');
    // 最大连击 / ACC / 理论最高分 / 评级（CHUNITHM 权重：JC 101% · J 100% · AT 50%）
    (function () {
      var jcN = g.justice_crit | 0, juN = g.justice | 0;
      var atN = g.attack | 0, miN = g.miss | 0;
      var judged = jcN + juN + atN + miN;
      var acc = judged ? (jcN * 1.01 + juN + atN * 0.5) / judged * 100 : 0;
      var ae = $('accv'), me = $('maxv');
      if (ae) ae.textContent = judged ? acc.toFixed(2) + '%' : '--.--%';
      if (me) me.textContent = mcNow;

      // 评级边界（CHUNITHM NEW 及以后）
      function rankOf(sc) {
        if (sc >= 1009000) return ['SSS+', 'sssp'];
        if (sc >= 1007500) return ['SSS', 'sss'];
        if (sc >= 1005000) return ['SS+', 'ssp'];
        if (sc >= 1000000) return ['SS', 'ss'];
        if (sc >= 990000)  return ['S+', 'sp'];
        if (sc >= 975000)  return ['S', 's'];
        if (sc >= 950000)  return ['AAA', 'aaa'];
        if (sc >= 925000)  return ['AA', 'aa'];
        if (sc >= 900000)  return ['A', 'a'];
        if (sc >= 800000)  return ['BBB', 'bbb'];
        if (sc >= 700000)  return ['BB', 'bb'];
        if (sc >= 600000)  return ['B', 'b'];
        if (sc >= 500000)  return ['C', 'c'];
        return ['D', 'd'];
      }

      // 理论最高分：剩余音符全按 JUSTICE CRITICAL 计算的最终分数
      var nt = g.note_total | 0, th = 0;
      // 优先用游戏自己算的理论最高分（hook 捕获），没有再用本地推算兜底
      var ms = g.max_score | 0;
      if (ms > 0 && ms <= 1010000 && ms >= (g.score | 0)) {
        th = ms;
      } else if (nt > 0 && judged <= nt) {
        th = Math.round((1.01 * jcN + juN + 0.5 * atN + 1.01 * (nt - judged)) / nt * 1000000);
        if (th > 1010000) th = 1010000;
      }
      var art = $('rankart');
      if (art) {
        var rt = rankOf(th || (g.score | 0));
        art._rkTxt = rt[0];
        if (RANK_IMG && art._rk !== rt[0]) {
          art._rk = rt[0];
          art.innerHTML = rankHTML(rt[0]);
          art.classList.remove('pop');
          void art.offsetWidth;
          art.classList.add('pop');
        }
        art.classList.toggle('hidden', !th && !RANK_IMG);
      }
      fitScore();
    })();

    // 右侧双向条形图：三组判定的 LATE（左）/ FAST（右）分布
    (function () {
      var chart = $('jchart');
      if (!chart) return;
      var ljc = g.late_jc | 0, fjc = g.fast_jc | 0;
      var lat = g.late_attack | 0, fat = g.fast_attack | 0;
      var lju = Math.max(0, (g.late | 0) - ljc - lat);
      var fju = Math.max(0, (g.fast | 0) - fjc - fat);
      var data = [[ljc, fjc], [lju, fju], [lat, fat]];
      var max = 1, i, j;
      for (i = 0; i < 3; ++i) for (j = 0; j < 2; ++j) if (data[i][j] > max) max = data[i][j];
      var rows = chart.querySelectorAll('.jrow');
      for (i = 0; i < rows.length && i < 3; ++i) {
        var bl = rows[i].querySelector('.jbl'), br = rows[i].querySelector('.jbr');
        var cl = rows[i].querySelector('.cl'), cr = rows[i].querySelector('.cr');
        var lv = data[i][0], rv = data[i][1];
        if (bl) bl.style.width = (lv / max * 50) + '%';
        if (br) br.style.width = (rv / max * 50) + '%';
        if (cl) cl.textContent = lv;
        if (cr) cr.textContent = rv;
        rows[i].style.opacity = (lv || rv) ? '1' : '.45';
      }
    })();
    // 达成状态：全 JC → ALL JUSTICE，非 JC 但仍无断连 → FULL COMBO
    var nJC = g.justice_crit | 0, nJ = g.justice | 0;
    var nAT = g.attack | 0, nMI = g.miss | 0;
    var total = nJC + nJ + nAT + nMI;
    var tag = '';
    if (total > 0) {
      if (nMI > 0) tag = '';
      else if (nAT > 0) tag = 'FC';
      else if (nJ > 0) tag = 'AJ';
      else tag = 'AJC';                 /* 全 CRITICAL */
    }
    var slot = $('cmslot');
    if (slot) {
      slot.__tag = tag;
      renderComboBadge(slot, tag);
    }
    // 判定流：切歌或计数清零时一起清空
    if (total === 0) feedEl.innerHTML = '';

    panel.classList.toggle('state-idle', !inGame);
    panel.classList.toggle('state-play', inGame);
    panel.classList.remove('hidden');


  }

  /* 连击徽章：使用游戏素材 CHU_UI_Common_batch_00 的 FULL COMBO / ALL JUSTICE / ABSOLUTE */
  function renderComboBadge(slot, tag) {
    var B = window.COMBO_BADGES;
    if (!slot) return;
    tag = tag || '';
    /* 状态没变就直接返回，避免每帧重建 <img> 造成闪烁 / 卡顿 */
    if (slot.__shown === tag) return;
    slot.__shown = tag;
    /* 没有 FC / AJ / AJC 时留空，但槽位宽度固定，后面的 COMBO 不会移动 */
    if (!tag) { slot.innerHTML = ''; return; }
    var key = tag === 'AJC' ? 'ajc' : (tag === 'FC' ? 'fc' : 'aj');
    var src = B && B[key] && B[key].m;
    if (!src) { slot.innerHTML = ''; return; }
    slot.innerHTML = '';
    var im = document.createElement('img');
    im.src = src;
    im.alt = tag;
    slot.appendChild(im);
  }
  fetch('combo_badges.json').then(function (r) { return r.json(); }).then(function (d) {
    window.COMBO_BADGES = d;
    var slot = $('cmslot');
    if (slot) renderComboBadge(slot, slot.__tag || '');
  }).catch(function () {});

  function connect() {
    var es = new EventSource(API + '/events');
    es.onmessage = function (e) {
      try {
        var d = JSON.parse(e.data);
        if (d.type === 'event') pushEvent(d);
        else applyState(d);
      } catch (err) { /* ignore */ }
    };
    es.onerror = function () {
      es.close();

      setTimeout(connect, 2000);
    };
  }

  srToggleEl.addEventListener('click', function () {
    var enable = !srToggleEl.classList.contains('on');
    fetch('/songrequest/' + (enable ? 'enable' : 'disable'), { method: 'POST' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.ok) pollState(); })
      .catch(function () {});
  });

  if (location.search.indexOf('board=1') >= 0) queuePanel.classList.remove('hidden');
  if (location.search.indexOf('qdemo=1') >= 0) {
    setTimeout(function () {
      window.__qdemo = true;
      applyQueue({ __demo: true, enabled: true, items: [
        { id: 1, song_id: 928, difficulty: 3, 'const': 14.9, title: "DON'T STOP ROCKIN' ~Ouroboros~", artist: 'cosMo@暴走P', playing: false },
        { id: 2, song_id: 1234, difficulty: 4, 'const': 15.2, title: 'the EmpErroR', artist: 'sasakure.UK', playing: false },
        { id: 3, song_id: 777, difficulty: 2, 'const': 13.4, title: '花たちに希望を', artist: 'Sound piercer', playing: false },
        { id: 4, song_id: 555, difficulty: 0, 'const': 8.5, title: '花と、雪と、ドラムンベース。', artist: 'kanone', playing: false },
        { id: 5, song_id: 777, difficulty: 3, 'const': 14.2, title: 'ナイト・オブ・ナイツ (USAO Remix)', artist: 'ビートまりお', playing: false },
        { id: 6, song_id: 928, difficulty: 2, 'const': 13.9, title: 'Grievous Lady', artist: 'Team Grimoire', playing: false }
      ] }, null);
      if (location.search.indexOf('qdel=1') >= 0) {
        setTimeout(function () {
          var ds = document.querySelectorAll('.qdel');
          for (var qi = 0; qi < ds.length; ++qi) { ds[qi].style.opacity = '1'; ds[qi].style.transform = 'scale(1)'; }
        }, 700);
      }
      if (location.search.indexOf('qhover=1') >= 0) {
        setTimeout(function () { queueHoverId = 1; layoutQueue(); }, 700);
      }
    }, 600);
  }
  // 首屏先显示待机牌，状态到达后按游玩/空闲切换
  standbyMode = true;
  setStandby();

  if (location.search.indexOf('demo=1') >= 0) {
    var demoTitles = [
      '最終鬼畜妹フランドール・S (原口沙輔は鬼畜なのか？remix)',
      'Grievous Lady -nothing is but what is not- (Extended Mix)',
      'HECATONCHEIR [CHUNITHM MASTER 15.4] / kors k vs. USAO'
    ];
    var demoArtists = [
      'ビートまりお × 原口沙輔 feat. 上海アリス幻樂団',
      'Team Grimoire vs Laur (Laur Arrange) / HARDCORE TANO*C',
      'kors k / USAO - beatmania IIDX 20th Anniversary'
    ];
    var DEMO_JACKET = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#3b2a6e"/><stop offset="1" stop-color="#8a4ad8"/>' +
      '</linearGradient></defs><rect width="300" height="300" fill="url(#g)"/>' +
      '<text x="150" y="185" font-size="110" text-anchor="middle" fill="#ffffff" ' +
      'opacity="0.75" font-family="sans-serif">&#9835;</text></svg>');
    var di = 0, djc = 0, dju = 0, dat = 0, dmi = 0, dscore = 0, dcombo = 0;
    setInterval(function () {
      var r = Math.random();
      var ev;
      if (r < 0.08) { ev = 'MISS'; dmi++; dcombo = 0; }
      else if (r < 0.2) { ev = 'ATTACK'; dat++; dcombo = 0; }
      else if (r < 0.5) { ev = 'JUSTICE_CRITICAL'; djc++; dcombo++; }
      else { ev = 'JUSTICE'; dju++; dcombo++; }
      dscore = Math.min(dscore + 1010, 1009000);
      pushEvent({ judge: ev, delta_ms: Math.round((r * 24) - 12) });
      applyState({
        demo: true,
        game: { in_game: true, music_id: 928, difficulty: 3, score: dscore, note_total: 1280, best_score: 1009231, max_score: 1009800,
                combo: dcombo, max_combo: dcombo, justice_crit: djc, justice: dju,
                attack: dat, miss: dmi, fast: dju, late: dmi },
        song: { known: true, title: demoTitles[di], artist: demoArtists[di],
                bpm: 174, difficulty_name: 'MASTER',
                consts: [3.0, 6.0, 10.5, 13.7, null, null], we_tag: '' },
        plugin: { profile: 'demo', signatures: true }
      });
      if (dscore >= 1009000) { di = (di + 1) % 3; djc = dju = dat = dmi = dscore = dcombo = 0; }
      $('jacket').src = DEMO_JACKET;
      panel.classList.remove('hidden');
    }, 350);
  } else if (location.search.indexOf('static=1') >= 0) {
    // 调试：只取一次状态，便于无 SSE 环境截图/排查
    pollState();
  } else {
    try { connect(); } catch (e) { /* EventSource 不可用时靠轮询 */ }
    pollState();
    // 选歌预览：未进入游玩时快速跟随当前选中歌曲（本地请求，开销很小）
    setInterval(function () {
      if (!lastInGame) pollState();
    }, 120);
    // 兜底：长时间没有判定事件时慢速轮询
    setInterval(function () {
      if (lastInGame && Date.now() - lastEvent >= 5000) pollState();
    }, 1500);
  }

  function pollState() {
    fetch(API + '/state', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(applyState)
      .catch(function () {});
  }
})();
</script>
</body>
</html>
