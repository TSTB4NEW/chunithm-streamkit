<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>CHUNITHM StreamKit Chat</title>
<style>
  :root {
    --bg: rgba(10, 12, 24, 0.96);
    --dim: #8a91a8;
    --fg: #eef2ff;
    --panel-w: 452px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; }
  body {
    width: var(--panel-w);
    --ui-scale: 1.26106;
    zoom: var(--ui-scale);
    font-family: "Segoe UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: var(--fg);
  }
  #card {
    width: 100%;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;
    padding: 9px 14px 10px;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 24px rgba(0,0,0,.45);
    overflow: hidden;
  }
  #card.hidden { display: none; }
  #list { display: flex; flex-direction: column; }
  .citem {
    display: flex; align-items: baseline; gap: 7px;
    padding: 4px 0; border-top: 1px solid rgba(255,255,255,.06);
    animation: rowIn .28s cubic-bezier(.2,.8,.2,1);
  }
  .citem.first { border-top: 0; }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .citem .cu {
    font-size: 12px; color: #7cc0ff; font-weight: 600; flex: 0 0 auto;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .citem .ct {
    font-size: 12px; color: #e6e9f2; min-width: 0; flex: 1 1 auto;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
</style>
</head>
<body>
  <div id="card" class="hidden"><div id="list"></div></div>
<script>
(function () {
  'use strict';
  var API = (location.protocol === 'file:') ? 'http://127.0.0.1:8770' : '';
  var card = document.getElementById('card');
  var list = document.getElementById('list');
  var els = {};

  function render(items) {
    if (!items || !items.length) {
      card.classList.add('hidden');
      list.innerHTML = '';
      els = {};
      return;
    }
    var seen = {};
    for (var i = 0; i < items.length; ++i) {
      var it = items[i];
      var key = (it.t || 0) + '|' + (it.user || '') + '|' + (it.text || '');
      var row = els[key];
      if (!row) {
        row = document.createElement('div');
        row.className = 'citem';
        row.innerHTML = '<span class="cu"></span><span class="ct"></span>';
        els[key] = row;
      }
      row.children[0].textContent = it.user || '';
      row.children[1].textContent = it.text || '';
      row.classList.toggle('first', i === 0);
      seen[key] = true;
      if (list.children[i] !== row) list.insertBefore(row, list.children[i] || null);
    }
    for (var k in els) {
      if (!seen[k]) {
        if (els[k].parentNode) els[k].parentNode.removeChild(els[k]);
        delete els[k];
      }
    }
    card.classList.remove('hidden');
  }

  function poll() {
    fetch(API + '/state', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (s) { render(s && s.chat ? s.chat.items : []); })
      .catch(function () {});
  }

  if (location.search.indexOf('static=1') >= 0) poll();
  else { poll(); setInterval(poll, 1200); }
})();
</script>
</body>
</html>
